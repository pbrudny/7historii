server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # old WordPress feed/admin URLs
    location ~ ^/(feed|comments/feed|wp-admin|wp-login\.php|xmlrpc\.php|wp-json)(/|$) { return 301 /; }

    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 30d; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
